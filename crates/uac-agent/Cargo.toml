[package]
name = "uac-agent"
description = "Agente de nodo: inventario de hardware hoy; red, leases y jobs en la Fase 1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
clap.workspace = true
if-addrs = "0.15.0"
mdns-sd = "0.21.7"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
uac-planner = { version = "0.1.0", path = "../uac-planner" }
uac-probe.workspace = true
uac-protocol.workspace = true

[target."cfg(windows)".dependencies]
notify-rust = "4.17.0"
tao = "0.37.2"
tray-icon = "0.24.2"
