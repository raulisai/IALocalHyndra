[workspace]
resolver = "3"
members = [
    "crates/uac-protocol",
    "crates/uac-probe",
    "crates/uac-planner",
    "crates/uac-agent",
    "crates/uac-controller",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

uac-planner = { path = "crates/uac-planner" }
uac-probe = { path = "crates/uac-probe" }
uac-protocol = { path = "crates/uac-protocol" }
